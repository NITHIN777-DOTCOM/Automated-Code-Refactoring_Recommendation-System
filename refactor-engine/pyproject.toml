[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-scan"
version = "0.3.0"
description = "AST-based Python code smell detector and refactoring suggester (God Class, Data Class, Feature Envy, Long Method) with an ML classifier and graph-based Extract Class suggestions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nithin" }]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "rich-click>=1.7",
    "pandas>=2.0",
    "numpy>=1.24",
    # Pinned exactly, not a floor: the shipped .pkl model was trained under
    # this scikit-learn version. Pickled sklearn estimators are sensitive to
    # the training version -- a newer resolved version loads the model with
    # an InconsistentVersionWarning and no guarantee of correct behavior.
    "scikit-learn==1.8.0",
    "joblib>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
refactor-scan = "engine.cli.main:main"

[tool.setuptools.packages.find]
include = ["engine*"]

# The trained classifier ships inside the package -- without this, an
# installed copy has no model to load and every prediction fails. The
# models/ subdirectory holds the opt-in alternatives as self-contained
# bundles (see engine/ml/bundle.py); it lives under engine/ rather than at
# the repository root precisely so that `include = ["engine*"]` above ships
# it, since a top-level models/ would exist in a checkout and vanish from an
# installed refactor-scan.
[tool.setuptools.package-data]
"engine.ml" = ["*.pkl", "models/*.joblib"]
